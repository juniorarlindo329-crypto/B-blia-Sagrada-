<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#151311" />
  <meta name="description" content="Bíblia Sagrada com capa personalizada, versões, meditações, destaques e menu completo." />
  <title>Bíblia Sagrada • Palavra Viva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css?v=2.5" />
</head>
<body>
  <div id="splash" class="splash">
    <img src="./cover-biblia.png" alt="Capa Bíblia Sagrada" class="splash-cover" />
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <div class="splash-mark">✝</div>
      <h1>BÍBLIA SAGRADA</h1>
      <p>Palavra Viva</p>
    </div>
  </div>

  <div id="app" class="app-shell">
    <aside id="drawer" class="drawer">
      <div class="drawer-panel">
        <div class="drawer-head">
          <div>
            <div class="drawer-title">Menu</div>
            <div class="drawer-subtitle">Bíblia Sagrada • Palavra Viva</div>
          </div>
          <button class="circle-btn" onclick="closeDrawer()" aria-label="Fechar menu">✕</button>
        </div>
        <div id="drawerContent"></div>
      </div>
      <button class="drawer-backdrop" onclick="closeDrawer()" aria-label="Fechar menu"></button>
    </aside>

    <header class="topbar">
      <div class="topbar-left">
        <button class="circle-btn" onclick="openDrawer()" aria-label="Abrir menu">☰</button>
        <div>
          <span class="eyebrow">PALAVRA VIVA</span>
          <h1 id="pageTitle">Início</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="circle-btn hidden" aria-label="Instalar aplicativo">⇩</button>
        <button class="circle-btn" onclick="quickOpenVersions()" aria-label="Abrir versões">🅰</button>
        <button id="themeBtn" class="circle-btn" aria-label="Alternar tema">☾</button>
      </div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home"><span>⌂</span><small>Início</small></button>
      <button class="nav-item" data-page="bible"><span>📖</span><small>Bíblia</small></button>
      <button class="nav-item" data-page="search"><span>⌕</span><small>Buscar</small></button>
      <button class="nav-item" data-page="versions"><span>🅰</span><small>Versões</small></button>
      <button class="nav-item" data-page="harpa"><span>🎼</span><small>Harpa</small></button>
      <button class="nav-item" data-page="favorites"><span>♡</span><small>Salvos</small></button>
    </nav>
  </div>


  <div id="worshipPlayer" class="worship-player hidden">
    <audio id="worshipAudio" preload="metadata"></audio>

    <div id="worshipYoutubeBox" class="worship-youtube-box hidden">
      <iframe id="worshipYoutubeFrame"
        title="Louvor brasileiro"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <div class="worship-player-main">
      <button id="worshipPlayBtn" class="worship-player-btn" onclick="toggleWorshipPlayback()">▶</button>
      <div class="worship-player-info" onclick="navigate('hymns')">
        <strong id="worshipPlayerTitle">Louvor</strong>
        <small id="worshipPlayerSubtitle">Player da Bíblia</small>
      </div>
      <button class="worship-player-btn small-btn" onclick="playPreviousWorship()">‹</button>
      <button class="worship-player-btn small-btn" onclick="playNextWorship()">›</button>
      <button class="worship-player-btn small-btn hide-player-btn" onclick="hideWorshipPlayer()" title="Ocultar player">⌄</button>
      <button class="worship-player-btn small-btn" onclick="stopWorship()">✕</button>
    </div>

    <div id="worshipProgress" class="worship-progress">
      <span id="worshipCurrentTime">0:00</span>
      <input id="worshipSeek" type="range" min="0" max="100" value="0" oninput="seekWorship(this.value)">
      <span id="worshipDuration">0:00</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./harpa-data.js?v=2.5"></script>
  <script src="./app.js?v=2.5"></script>
</body>
</html>
